  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--mute); font-weight:600; background:var(--soft); }
  td.n, th.n { text-align:right; }

  .empty { border:1px dashed var(--line); border-radius:8px; padding:24px; text-align:center; color:var(--mute); }
  .wb { display:grid; grid-template-columns:minmax(240px, 320px) 1fr; gap:0; border:1px solid var(--line); border-radius:8px; min-height:60vh; }
  .wb .list { border-right:1px solid var(--line); overflow:auto; }
  .wb .filters { display:flex; gap:6px; padding:10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .wb .filters button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:3px 10px; cursor:pointer; font-size:12px; }
  .wb .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .wb .item { display:block; padding:10px; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
  .wb .item.on { background:#eef2fd; box-shadow:inset 3px 0 var(--acc); }
  .wb .detail { padding:16px 20px; }
  .step { border:1px solid var(--line); border-radius:8px; margin:12px 0; }
  .step > h3 { padding:8px 12px; background:var(--soft); border-bottom:1px solid var(--line); margin:0; font-size:13px; }
  .step > div { padding:10px 12px; }
  .src { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:8px 10px; overflow-x:auto; white-space:pre; }
  .quote { border-left:3px solid var(--acc); padding:4px 10px; margin:6px 0; background:#f3f6fe; }
  tr.target td { background:#eef2fd; }
  .memo { max-width:860px; }
  .memo .q { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--acc); font-weight:700; margin-top:22px; }

<script>
"use strict";
const D = JSON.parse(document.getElementById("report-data").textContent);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const money = v => v == null || v === "" ? "—" : (Number(v) < 0 ? "(" : "") + "$" + Math.abs(Number(v)).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2}) + (Number(v) < 0 ? ")" : "");
const LABEL = { error:"Error", valid:"Valid Explanation", "needs-info":"Needs Info", pass:"Pass", warn:"Warn", fail:"Fail" };
const chip = s => `<span class="chip ${esc(s)}">${esc(LABEL[s] || s)}</span>`;
const VIEWS = { findings:"Findings", customers:"Customers", brief:"Brief", controls:"Controls & assumptions", evidence:"Evidence index" };
let filter = "all";

function overall() { return D.controls.some(c => c.status === "fail") ? "fail" : D.controls.some(c => c.status === "warn") ? "warn" : "pass"; }
function header() {
  const f = D.findings, n = s => f.filter(x => x.status === s).length;
  document.getElementById("hdr").innerHTML = `<b>RelayCloud · ${esc(D.run.label)} billing review</b>
    <span class="stat"><b>${f.length}</b><span class="mute">findings</span></span>
    <span class="stat"><b>${n("error")}</b><span class="mute">errors</span></span>
    <span class="stat"><b>${n("needs-info")}</b><span class="mute">need info</span></span>
    <span class="stat">${chip(overall())} <span class="mute">controls ${D.controls.filter(c=>c.status==="pass").length}/${D.controls.length}</span></span>
    <span class="mute mono" style="margin-left:auto">${esc(D.run.command)} · commit ${esc(D.run.commit)} · cutoff ${esc(D.run.cutoff)}</span>`;
}
function nav(cur) {
  document.getElementById("nav").innerHTML = Object.entries(VIEWS).map(([k,v]) => `<a href="#${k}" class="${k===cur?"on":""}">${v}</a>`).join("");
}
function srcRef(file, line) { return `<span class="mono">${esc(file)}${line ? ":" + esc(line) : ""}</span>`; }

function findingsView(selId) {
  if (!D.findings.length) return `<div class="empty"><h2>No findings yet</h2>The workbench skeleton is running; the accounting logic that produces
    Findings is built next. Controls, Customers and the Evidence index are already live.</div>`;
  const list = D.findings.filter(f => filter === "all" || f.status === filter);
  const f = D.findings.find(x => x.id === selId) || list[0] || D.findings[0];
  return `<div class="wb"><div class="list">
      <div class="filters">${["all","error","valid","needs-info"].map(s=>`<button data-f="${s}" class="${filter===s?"on":""}">${s==="all"?"All":LABEL[s]}</button>`).join("")}</div>
      ${list.map(x=>`<a class="item ${x.id===f.id?"on":""}" href="#${esc(x.id)}"><b>${esc(x.id)}</b> · ${esc(x.customer_name)}
        <div class="mute" style="font-size:12px">${esc(x.title)}</div><div>${chip(x.status)} <span class="mute">${money(x.amount)}</span></div></a>`).join("")}
    </div><div class="detail">
      <h1>${esc(f.id)} · ${esc(f.title)}</h1>
      <div>${chip(f.status)} <a href="#C-${esc(f.customer_id)}">${esc(f.customer_name)}</a> <span class="mute">· ${esc(f.period)} · ${esc(f.stream)} · ${money(f.amount)}</span></div>
      <p>${esc(f.summary)}</p>
      <div class="step"><h3>1 · Calculation</h3><div class="mono">${(f.calculation||[]).map(esc).join("<br>")}</div></div>
      <div class="step"><h3>2 · Evidence</h3><div>${(f.evidence||[]).map(e => e.quote
          ? `<div class="quote">${srcRef(e.file, e.line)}<br>“${esc(e.quote)}”</div>`
          : `${srcRef(e.file, e.line)}<div class="src mono">${esc(e.text)}</div>`).join("")}</div></div>
      <div class="step"><h3>3 · Recommended action</h3><div>${esc(f.action)}</div></div>
      <div class="step"><h3>4 · Proposed entry</h3><div>${f.entry_id ? esc(f.entry_id) : '<span class="mute">None proposed.</span>'}</div></div>
    </div></div>`;
}

function customersView(target) {
  return `<h1>Customers (${D.customers.length})</h1>
    <p class="mute">Every customer in the population, with identities across systems and terms in force at period start.
    Expected vs actual billing (platform and usage separately) is filled in by the accounting logic.</p>
    <div class="scroll"><table><tr><th>Customer</th><th>NetSuite</th><th>Contract</th><th>Billing</th><th class="n">Platform invoice</th>
      <th class="n">Included runs</th><th class="n">Overage $/run</th><th>Documents</th><th class="n">Platform exp. / act.</th><th class="n">Usage exp. / act.</th><th>Source</th></tr>
    ${D.customers.map(c => `<tr id="C-${esc(c.customer_id)}" class="${target==="C-"+c.customer_id?"target":""}"><td><b>${esc(c.customer_name)}</b></td>
      <td class="mono">${esc(c.customer_id)}</td><td class="mono">${esc(c.contract_id)}</td><td>${esc(c.billing_frequency)}</td>
      <td class="n">${money(c.platform_invoice_amount)}</td><td class="n">${c.included_runs_per_month ? Number(c.included_runs_per_month).toLocaleString() : "—"}</td>
      <td class="n">${esc(c.overage_rate || "—")}</td><td class="mono">${esc(c.documents)}</td><td class="n mute">— / —</td><td class="n mute">— / —</td>
      <td>${srcRef(c.source_file, c.source_line)}</td></tr>`).join("")}
    </table></div>`;
}

function briefView() {
  const tb = D.trial_balance_by_account;
  return `<div class="memo"><h1>${esc(D.run.label)} billing review — brief</h1>
    <p class="mute">For the Controller. Recommendations require approval; nothing has been posted or invoiced.</p>
    <div class="q">1 · What should we have billed?</div><p class="mute">Expected vs actual billing per customer — pending accounting logic. See <a href="#customers">Customers</a>.</p>
    <div class="q">2 · Which differences need action?</div><p class="mute">${D.findings.length} findings. See <a href="#findings">Findings</a>.</p>
    <div class="q">3 · Does anything change ${esc(D.run.label)}'s books?</div>
    <div class="scroll"><table><tr><th>Account</th><th class="n">Recorded</th><th class="n">With proposed</th><th class="n">Change</th></tr>
      ${tb.map(r=>`<tr><td>${esc(r.account_number)} ${esc(r.account_name)}</td><td class="n">${money(r.recorded_balance)}</td><td class="n">${money(r.with_proposed_balance)}</td><td class="n">${money(r.proposed_change)}</td></tr>`).join("")}
    </table></div><p class="mute" style="font-size:12px">Signed debit − credit at period end, summed across customers (never netted per customer in the workpaper: <code>trial_balance.csv</code>).</p>
    <div class="q">4 · How do we catch this next month?</div>
    <p>Drop next month's extracts into <code>data/raw/&lt;YYYY-MM&gt;/</code>, add <code>data/curated/&lt;YYYY-MM&gt;/period.yaml</code> and any Amendment terms, then run
    <code>make run PERIOD=&lt;YYYY-MM&gt;</code>. Missing inputs, unparseable Order Forms and uncited Amendment terms stop the run with a message. See <a href="#controls">Controls</a>.</p></div>`;
}

function controlsView() {
  return `<h1>Controls</h1><div class="scroll"><table><tr><th>Status</th><th>Group</th><th>Control</th><th class="n">Rows</th><th>Detail</th></tr>
    ${D.controls.map(c=>`<tr><td>${chip(c.status)}</td><td>${esc(c.group)}</td><td>${esc(c.title)}</td><td class="n">${c.count}</td>
      <td class="mute">${c.view ? `offending rows: <code>${esc(c.view)}</code>` : esc(c.detail)}</td></tr>`).join("")}</table></div>
    <h2>Assumptions</h2><ul>${D.assumptions.map(a=>`<li>${esc(a.text)} <span class="mute">(${esc(a.source)})</span></li>`).join("")}</ul>
    <h2>Input row counts</h2><table><tr><th>File</th><th class="n">Rows</th></tr>${Object.entries(D.stats.row_counts).map(([f,n])=>`<tr><td class="mono">${esc(f)}</td><td class="n">${n}</td></tr>`).join("")}</table>
    <h2>Workpapers</h2><ul>${D.workpapers.map(w=>`<li><a href="${esc(w)}">${esc(w)}</a></li>`).join("")}</ul>`;
}

function evidenceView() {
  if (!D.evidence.length) return `<h1>Evidence index</h1><div class="empty">No evidence cited yet — every source row cited by a Finding will be listed here, grouped by file.</div>`;
  const byFile = {}; D.evidence.forEach(e => (byFile[e.file] = byFile[e.file] || []).push(e));
  return `<h1>Evidence index</h1>` + Object.entries(byFile).map(([file, es]) => `<h2 class="mono">${esc(file)}</h2><table><tr><th>Line</th><th>Cited by</th><th>Content</th></tr>
    ${es.map(e=>`<tr><td class="mono">${esc(e.line)}</td><td>${(e.cited_by||[]).map(id=>`<a href="#${esc(id)}">${esc(id)}</a>`).join(", ")}</td><td class="mono">${esc(e.text || e.quote)}</td></tr>`).join("")}</table>`).join("");
}

function render() {
  const h = decodeURIComponent(location.hash.slice(1)) || "findings";
  let view = VIEWS[h] ? h : h.startsWith("C-") ? "customers" : "findings";
  header(); nav(view);
  document.getElementById("view").innerHTML =
    view === "findings" ? findingsView(VIEWS[h] ? null : h) : view === "customers" ? customersView(h) :
    view === "brief" ? briefView() : view === "controls" ? controlsView() : evidenceView();
  if (h.startsWith("C-")) { const el = document.getElementById(h); if (el) el.scrollIntoView({block:"center"}); }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; render(); } });
window.addEventListener("hashchange", render);
render();
</script>
