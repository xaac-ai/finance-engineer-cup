[project]
name = "workbench"
version = "0.1.0"
description = "RelayCloud billing review workbench (Finance Engineer Cup II: Billing Battle)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[dependency-groups]
agents = [
    "anthropic>=2.8.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
workbench = "workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
